services:
  avr-core:
    image: agentvoiceresponse/avr-core
    platform: linux/x86_64
    container_name: avr-core
    restart: always
    environment:
      - TZ=Pacific/Noumea  # <--- AJOUTEZ CETTE LIGNE
      - PORT=5001 
      # MODIFICATION CRITIQUE : Faire pointer le core vers le nouveau service Azure STS
      - STS_URL=ws://avr-sts-azureopenai:6030
    ports:
      - 5001:5001
    networks:
      - avr

  # --- DEBUT DE LA SECTION MODIFIÉE ---
  avr-sts-azureopenai:
    # On utilise l'image que vous avez créée localement
    image: avr-sts-azureopenai:latest
    platform: linux/x86_64
    container_name: avr-sts-azureopenai
    restart: always
    ports:
      - "6030:6030"
    
    environment:
        TZ: Pacific/Noumea  # <--- AJOUTEZ CETTE LIGNE
        # --- Paramètres spécifiques ---
        AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
        AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
        AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
        AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
        
        # --- Paramètres communs ---
        PORT: 6030
        AMI_URL: ${AMI_URL:-http://avr-ami:6006}
        
        # --- INJECTION DU CSV ICI ---
        OPENAI_INSTRUCTIONS: |
          Tu es un assistant vocal téléconseiller pour l'OPT-NC (Office des Postes et Télécommunications de Nouvelle-Calédonie) qui rend le service de renseignement téléponique.
          Ton rôle est d'aider les utilisateurs à trouver des coordonnées de particuliers ou professionels dans l'annuaire.

          RÈGLES IMPORTANTES :
          1. Tu ne connais pas les numéros par cœur.
          2. Pour chaque demande de l'utilisateur (nom ou numéro), tu DOIS utiliser l'outil `search_contact`.
          3. N'invente jamais de réponse. Si l'outil ne trouve rien, dis que tu ne trouves pas et demande à l'utilisteur d'épeler le nom ou de répéter le numéro de téléphone chiffre par chiffre.
          4. Ne donne jamais plus de 10 numéros de téléphones ou contacts à la fois.
          5. Sois toujours poli et concis.
          6. Quand tu prononces un numéro de téléphone, prononce le toujours par paire de chiffre (exemple : dix-huit, seize, quatre-vingt-onze, zero-quatre).
          7. Si le client demande un service autre que du resnseignement téléphonique, propose lui de contacter le 1000 dont l'appel est gratuit.
          8. Lorsque tu trouves des informations, ne donnes pas systématiquement l'adresse de la personne; apporte cette information seulement si l'utilisateur la demande explicitement.

          PROCESSUS :
          - D'abord accueille l'utilisateur poliment puis présente toujours succinctement le service que tu proposes, ensuite demande lui ce qu'il recherche.
          - Si l'utilisateur recherche un numéro de téléphone en donnant le nom du contact: donne lui directement le numéro si tu as un seul résultat; si tu en as plusieurs, indique lui le nombre de résultats; si tu ne trouves pas de contact, demande lui d'épeler le nom à rechercher.
          - Si l'utilisateur recherche le nom d'un particulier ou professionel en donnant le numéro de téléphone: donne lui directement le nom trouvé; si tu ne trouves rien, n'invente pas et dis lui que tu ne trouves pas puis demande lui de répéter le numéro chiffre par chiffre.
          - Si l'outil `search_contact` retourne plusieurs résultats : donnes en le nombre puis demande des précisions.       
          - Une fois l'information donnée, demande si le client a besoin d'autre chose.
          - Si c'est fini : Remercie, dis au revoir, et appelle l'outil `avr_hangup`.        
        # OPENAI_INSTRUCTIONS: |
        #   Tu es un assistant vocal téléconseiller pour l'OPT-NC (Office des Postes et Télécommunications de Nouvelle-Calédonie) qui rend le service de renseignement téléponique.
        #   Ton rôle est d'aider les utilisateurs à trouver des coordonnées dans l'annuaire.

        #   RÈGLES IMPORTANTES :
        #   1. Tu ne connais pas les numéros par cœur.
        #   2. Pour chaque demande de l'utilisateur (nom ou numéro), tu DOIS utiliser l'outil `search_contact`.
        #   3. N'invente jamais de réponse. Si l'outil ne trouve rien, dis que tu ne trouves pas et demande à l'utilisteur d'épeler le nom ou de répéter le numéro de téléphone chiffre par chiffre.
        #   4. Ne donne jamais plus de 10 numéros de téléphones ou contacts à la fois.
        #   5. Sois toujours poli et concis.
        #   6. Quand tu prononces un numéro de téléphone, prononce le toujours par paire de chiffre (exemple : dix-huit, seize, quatre-vingt-onze, zero-quatre).
        #   7. Si le client demande un service autre que du resnseignement téléphonique, propose lui de contater le 1000 dont l'appel est gratuit.

        #   PROCESSUS :
        #   - D'abord accueille l'utilisateur poliment puis présente toujours succinctement le service que tu proposes.
        #   - Si l'utilisateur donne un nom : Demande la ville si nécessaire pour affiner, puis appelle `search_contact`.
        #   - Si l'outil `search_contact` retourne plusieurs résultats : donnes en le nombre puis demande des précisions.       
        #   - Une fois l'information donnée, demande si le client a besoin d'autre chose.
        #   - Si c'est fini : Remercie, dis au revoir, et appelle l'outil `avr_hangup`.

    # La section volumes reste disponible si vous voulez utiliser des outils personnalisés
    # volumes:
    #   - ./tools:/usr/src/app/tools
    networks:
      - avr
  # --- FIN DE LA SECTION MODIFIÉE ---

  avr-asterisk:
    image: agentvoiceresponse/avr-asterisk
    platform: linux/x86_64
    container_name: avr-asterisk
    restart: always
    environment:
      - TZ=Pacific/Noumea  # <--- AJOUTEZ CETTE LIGNE    
    ports:
      - 5038:5038
      - 5060:5060
      - 8088:8088
      - 10000-10050:10000-10050/udp
    volumes:
      - ./asterisk/conf/manager.conf:/etc/asterisk/my_manager.conf
      - ./asterisk/conf/pjsip.conf:/etc/asterisk/my_pjsip.conf
      - ./asterisk/conf/extensions.conf:/etc/asterisk/my_extensions.conf
      - ./asterisk/conf/queues.conf:/etc/asterisk/my_queues.conf
      - ./asterisk/conf/ari.conf:/etc/asterisk/my_ari.conf
      # --- AJOUT DU VOLUME D'ENREGISTREMENT ---
      - ./asterisk/recordings:/var/spool/asterisk/monitor      
    networks:
      - avr

  avr-ami:
    # image: agentvoiceresponse/avr-ami
    image: avr-ami:latest
    platform: linux/x86_64
    container_name: avr-ami
    restart: always
    
    environment:
      - TZ=Pacific/Noumea  # <--- AJOUTEZ CETTE LIGNE    
      - PORT=6006
      - AMI_HOST=${AMI_HOST:-avr-asterisk}
      - AMI_PORT=${AMI_PORT:-5038}
      - AMI_USERNAME=${AMI_USERNAME:-avr}
      - AMI_PASSWORD=${AMI_PASSWORD:-avr}
    ports:
      - 6006:6006
    networks:
      - avr

networks:
  avr:
    name: avr
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
