name: CD - Build sts-azureopenai image to GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - dev
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          docker system prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Recrée les fichiers secrets
      #   run: |
      #     echo "${{ secrets.ENV_FILE }}" > .env
      #     echo "${{ secrets.ENV_API_FILE }}" > .env_api

      - name: Extract version/tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./avr-sts-azureopenai.dockerfile
          push: true
          platforms: linux/amd64
          # Label pour lier au repository
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
          # Nom unique pour cette image (ajout de -sts)
          tags: |
            ghcr.io/${{ github.repository }}-sts_azureopenai:latest
            ghcr.io/${{ github.repository }}-sts_azureopenai:${{ steps.vars.outputs.tag }}
